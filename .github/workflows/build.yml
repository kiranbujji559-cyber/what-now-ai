name: Build WHAT NOW AI

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create clean Flutter project
        run: |
          mkdir app
          cd app
          flutter create . --org com.whatnowai --project-name what_now_ai
          rm -f lib/main.dart

      - name: Create WHAT NOW AI app
        run: |
          cd app
          cat > lib/main.dart <<'DART'
import 'package:flutter/material.dart';
import 'package:flutter/services.dart';

void main() {
  runApp(const WhatNowApp());
}

class WhatNowApp extends StatelessWidget {
  const WhatNowApp({super.key});

  @override
  Widget build(BuildContext context) {
    return MaterialApp(
      debugShowCheckedModeBanner: false,
      title: 'WHAT NOW AI',
      theme: ThemeData(
        useMaterial3: true,
        brightness: Brightness.dark,
        scaffoldBackgroundColor: const Color(0xFF08090D),
        colorScheme: ColorScheme.fromSeed(
          seedColor: const Color(0xFF7C5CFF),
          brightness: Brightness.dark,
        ),
      ),
      home: const SplashPage(),
    );
  }
}

class SplashPage extends StatefulWidget {
  const SplashPage({super.key});

  @override
  State<SplashPage> createState() => _SplashPageState();
}

class _SplashPageState extends State<SplashPage> {
  @override
  void initState() {
    super.initState();
    Future.delayed(const Duration(seconds: 2), () {
      if (!mounted) return;
      Navigator.pushReplacement(
        context,
        MaterialPageRoute(
          builder: (_) => const HomePage(),
        ),
      );
    });
  }

  @override
  Widget build(BuildContext context) {
    return const Scaffold(
      body: Center(
        child: Column(
          mainAxisSize: MainAxisSize.min,
          children: [
            Logo(size: 86),
            SizedBox(height: 24),
            Text(
              'WHAT NOW',
              style: TextStyle(
                fontSize: 30,
                fontWeight: FontWeight.w900,
                letterSpacing: 4,
              ),
            ),
            SizedBox(height: 6),
            Text(
              'AI',
              style: TextStyle(
                color: Color(0xFF9B82FF),
                fontSize: 18,
                fontWeight: FontWeight.bold,
                letterSpacing: 6,
              ),
            ),
            SizedBox(height: 18),
            Text(
              'Send anything. Get clear actions.',
              style: TextStyle(color: Colors.white54),
            ),
          ],
        ),
      ),
    );
  }
}

class HomePage extends StatefulWidget {
  const HomePage({super.key});

  @override
  State<HomePage> createState() => _HomePageState();
}

class _HomePageState extends State<HomePage> {
  final TextEditingController controller = TextEditingController();

  void message(String text) {
    ScaffoldMessenger.of(context).showSnackBar(
      SnackBar(
        content: Text(text),
        behavior: SnackBarBehavior.floating,
      ),
    );
  }

  Future<void> paste() async {
    final data = await Clipboard.getData(Clipboard.kTextPlain);
    if (!mounted) return;

    if (data != null && data.text != null && data.text!.trim().isNotEmpty) {
      controller.text = data.text!;
      message('Pasted successfully.');
    } else {
      message('Clipboard is empty.');
    }
  }

  void analyze() {
    if (controller.text.trim().isEmpty) {
      message('Paste or type something first.');
      return;
    }

    Navigator.push(
      context,
      MaterialPageRoute(
        builder: (_) => AnalysisPage(
          text: controller.text.trim(),
        ),
      ),
    );
  }

  @override
  void dispose() {
    controller.dispose();
    super.dispose();
  }

  @override
  Widget build(BuildContext context) {
    return Scaffold(
      bottomNavigationBar: NavigationBar(
        backgroundColor: const Color(0xFF111218),
        destinations: const [
          NavigationDestination(
            icon: Icon(Icons.home_outlined),
            selectedIcon: Icon(Icons.home),
            label: 'Home',
          ),
          NavigationDestination(
            icon: Icon(Icons.history),
            label: 'History',
          ),
          NavigationDestination(
            icon: Icon(Icons.settings_outlined),
            label: 'Settings',
          ),
        ],
      ),
      body: SafeArea(
        child: SingleChildScrollView(
          padding: const EdgeInsets.all(20),
          child: Column(
            crossAxisAlignment: CrossAxisAlignment.start,
            children: [
              const Row(
                children: [
                  Logo(size: 45),
                  SizedBox(width: 12),
                  Text(
                    'WHAT NOW AI',
                    style: TextStyle(
                      fontSize: 20,
                      fontWeight: FontWeight.w900,
                    ),
                  ),
                ],
              ),
              const SizedBox(height: 42),
              const Text(
                'Anything confusing?',
                style: TextStyle(
                  fontSize: 31,
                  fontWeight: FontWeight.w900,
                ),
              ),
              const SizedBox(height: 8),
              const Text(
                'Send it to WHAT NOW.',
                style: TextStyle(
                  fontSize: 20,
                  color: Colors.white54,
                ),
              ),
              const SizedBox(height: 28),
              Container(
                decoration: BoxDecoration(
                  color: const Color(0xFF12141B),
                  borderRadius: BorderRadius.circular(22),
                  border: Border.all(color: Colors.white12),
                ),
                child: TextField(
                  controller: controller,
                  minLines: 7,
                  maxLines: 10,
                  decoration: const InputDecoration(
                    hintText:
                        'Paste a message, bill, email, offer or warning...',
                    hintStyle: TextStyle(color: Colors.white38),
                    border: InputBorder.none,
                    contentPadding: EdgeInsets.all(20),
                  ),
                ),
              ),
              const SizedBox(height: 14),
              Row(
                children: [
                  Expanded(
                    child: SmallButton(
                      icon: Icons.content_paste,
                      title: 'Paste',
                      onTap: paste,
                    ),
                  ),
                  const SizedBox(width: 10),
                  Expanded(
                    child: SmallButton(
                      icon: Icons.photo_outlined,
                      title: 'Photo',
                      onTap: () => message('Photo feature coming next.'),
                    ),
                  ),
                  const SizedBox(width: 10),
                  Expanded(
                    child: SmallButton(
                      icon: Icons.attach_file,
                      title: 'File',
                      onTap: () => message('File feature coming next.'),
                    ),
                  ),
                ],
              ),
              const SizedBox(height: 18),
              SizedBox(
                width: double.infinity,
                height: 58,
                child: ElevatedButton(
                  onPressed: analyze,
                  style: ElevatedButton.styleFrom(
                    backgroundColor: const Color(0xFF7C5CFF),
                    foregroundColor: Colors.white,
                    shape: RoundedRectangleBorder(
                      borderRadius: BorderRadius.circular(18),
                    ),
                  ),
                  child: const Row(
                    mainAxisAlignment: MainAxisAlignment.center,
                    children: [
                      Text(
                        'WHAT NOW?',
                        style: TextStyle(
                          fontWeight: FontWeight.w900,
                          letterSpacing: 1,
                        ),
                      ),
                      SizedBox(width: 10),
                      Icon(Icons.arrow_forward_rounded),
                    ],
                  ),
                ),
              ),
              const SizedBox(height: 35),
              const Text(
                'TRY IT WITH',
                style: TextStyle(
                  color: Colors.white38,
                  fontSize: 12,
                  fontWeight: FontWeight.bold,
                  letterSpacing: 2,
                ),
              ),
              const SizedBox(height: 14),
              ExampleCard(
                icon: Icons.receipt_long_outlined,
                title: 'A bill or payment',
                subtitle: 'Do I need to pay this?',
                onTap: () {
                  controller.text =
                      'Your payment of ₹4,999 is due by 25 September.';
                },
              ),
              ExampleCard(
                icon: Icons.work_outline,
                title: 'A job offer',
                subtitle: 'Is this offer safe?',
                onTap: () {
                  controller.text =
                      'You have been selected. Pay ₹2,000 registration fee to start.';
                },
              ),
              ExampleCard(
                icon: Icons.warning_amber_outlined,
                title: 'A suspicious message',
                subtitle: 'What should I do?',
                onTap: () {
                  controller.text =
                      'Your account will be blocked today. Click this link immediately.';
                },
              ),
            ],
          ),
        ),
      ),
    );
  }
}

