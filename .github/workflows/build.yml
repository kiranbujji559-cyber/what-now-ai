name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.3'
          channel: 'stable'

      - name: Build APK Real Firebase
        run: |
          mkdir -p /tmp/save
          cp android/app/google-services.json /tmp/save/ 2>/dev/null || true
          cp google-services.json /tmp/save/google-services.json 2>/dev/null || true
          cp lib/main.dart /tmp/main.dart
          cp pubspec.yaml /tmp/pubspec.yaml
          
          rm -rf android
          flutter create --project-name what_now_ai --platforms=android --org com.example.whatnowai .
          
          cp /tmp/main.dart lib/main.dart
          cp /tmp/pubspec.yaml pubspec.yaml
          mkdir -p android/app
          cp /tmp/save/google-services.json android/app/google-services.json
          echo "RESTORED JSON"
          
          # FIX 1: settings.gradle - add google-services version
          python3 << 'PY'
          import pathlib
          # Fix settings.gradle
          for p in [pathlib.Path("android/settings.gradle"), pathlib.Path("android/settings.gradle.kts")]:
              if p.exists():
                  t = p.read_text()
                  if "google-services" not in t:
                      if "id(\"dev.flutter.flutter-plugin-loader\")" in t:
                          t = t.replace('id("dev.flutter.flutter-plugin-loader")', 'id("dev.flutter.flutter-plugin-loader") version "1.0.0"\n        id("com.google.gms.google-services") version "4.4.0" apply false')
                      elif "id 'dev.flutter.flutter-plugin-loader'" in t:
                          t = t.replace("id 'dev.flutter.flutter-plugin-loader'", "id 'dev.flutter.flutter-plugin-loader' version '1.0.0'\n        id 'com.google.gms.google-services' version '4.4.0' apply false")
                      else:
                          # fallback add to plugins block
                          t = t.replace("plugins {", "plugins {\n        id(\"com.google.gms.google-services\") version \"4.4.0\" apply false\n")
                      p.write_text(t)
                      print(f"Fixed {p}")
          # Fix app build.gradle - add plugin without version
          for path in ["android/app/build.gradle", "android/app/build.gradle.kts"]:
              p = pathlib.Path(path)
              if p.exists():
                  t = p.read_text()
                  if "google-services" not in t:
                      if 'id "com.android.application"' in t:
                          t = t.replace('id "com.android.application"', 'id "com.android.application"\n    id "com.google.gms.google-services"')
                      if 'id("com.android.application")' in t:
                          t = t.replace('id("com.android.application")', 'id("com.android.application")\n    id("com.google.gms.google-services")')
                      p.write_text(t)
                      print(f"Fixed {path}")
          PY
          
          cat android/settings.gradle
          flutter pub get
          flutter build apk --debug

      - uses: actions/upload-artifact@v4
        with:
          name: WHAT-NOW-AI-FINAL-WORKING-APK
          path: build/app/outputs/flutter-apk/app-debug.apk
