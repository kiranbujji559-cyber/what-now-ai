            const SizedBox(height: 22),
            const InfoCard(
              icon: Icons.info_outline,
              title: 'WHAT IS THIS?',
              text:
                  'This information may require your attention. Verify the sender and important details.',
            ),
            const SizedBox(height: 12),
            const InfoCard(
              icon: Icons.bolt,
              title: 'URGENCY',
              text: 'Check the exact deadline before acting.',
            ),
            const SizedBox(height: 12),
            const InfoCard(
              icon: Icons.shield_outlined,
              title: 'RISK',
              text:
                  'Do not pay or share sensitive information until the source is verified.',
            ),
            const SizedBox(height: 14),
            Container(
              padding: const EdgeInsets.all(20),
              decoration: BoxDecoration(
                color: const Color(0xFF171321),
                borderRadius: BorderRadius.circular(22),
              ),
              child: const Column(
                crossAxisAlignment: CrossAxisAlignment.start,
                children: [
                  Text(
                    'WHAT SHOULD I DO NOW?',
                    style: TextStyle(
                      fontWeight: FontWeight.w900,
                    ),
                  ),
                  SizedBox(height: 18),
                  StepItem(
                    number: '1',
                    text: 'Verify the sender and details.',
                  ),
                  StepItem(
                    number: '2',
                    text: 'Check the deadline.',
                  ),
                  StepItem(
