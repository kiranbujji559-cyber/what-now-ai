name: Automate WHAT NOW AI APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create clean Flutter project
        run: |
          rm -rf app
          flutter create app --org com.whatnowai --project-name what_now_ai

      - name: Create WHAT NOW AI app
        run: |
          cat > app/lib/main.dart <<'DART'
          import 'package:flutter/material.dart';
          import 'package:flutter/services.dart';

          void main() {
            runApp(const WhatNowAI());
          }

          class WhatNowAI extends StatelessWidget {
            const WhatNowAI({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                debugShowCheckedModeBanner: false,
                title: 'WHAT NOW AI',
                theme: ThemeData(
                  brightness: Brightness.dark,
                  useMaterial3: true,
                  scaffoldBackgroundColor: const Color(0xFF080910),
                  colorScheme: ColorScheme.fromSeed(
                    seedColor: const Color(0xFF7C5CFF),
                    brightness: Brightness.dark,
                  ),
                ),
                home: const HomeScreen(),
              );
            }
          }

          class HomeScreen extends StatefulWidget {
            const HomeScreen({super.key});

            @override
            State<HomeScreen> createState() => _HomeScreenState();
          }

          class _HomeScreenState extends State<HomeScreen> {
            final controller = TextEditingController();

            void analyze() {
              final text = controller.text.trim();

              if (text.isEmpty) {
                ScaffoldMessenger.of(context).showSnackBar(
                  const SnackBar(
                    content: Text('Paste or type something first.'),
                  ),
                );
                return;
              }

              Navigator.push(
                context,
                MaterialPageRoute(
                  builder: (_) => AnalysisScreen(input: text),
                ),
              );
            }

            void paste() async {
              final data = await Clipboard.getData(Clipboard.kTextPlain);

              if (data?.text != null) {
                controller.text = data!.text!;
              }
            }

            @override
            void dispose() {
              controller.dispose();
              super.dispose();
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                bottomNavigationBar: NavigationBar(
                  selectedIndex: 0,
                  destinations: const [
                    NavigationDestination(
                      icon: Icon(Icons.home_outlined),
                      selectedIcon: Icon(Icons.home),
                      label: 'Home',
                    ),
                    NavigationDestination(
                      icon: Icon(Icons.history_outlined),
                      label: 'History',
                    ),
                    NavigationDestination(
                      icon: Icon(Icons.settings_outlined),
                      label: 'Settings',
                    ),
                  ],
                ),
                body: SafeArea(
                  child: SingleChildScrollView(
                    padding: const EdgeInsets.fromLTRB(20, 22, 20, 30),
                    child: Column(
                      crossAxisAlignment: CrossAxisAlignment.start,
                      children: [
                        Row(
                          children: [
                            Container(
                              width: 48,
                              height: 48,
                              decoration: BoxDecoration(
                                borderRadius: BorderRadius.circular(15),
                                gradient: const LinearGradient(
                                  colors: [
                                    Color(0xFF7657FF),
                                    Color(0xFFD34FFF),
                                  ],
                                ),
                              ),
                              child: const Icon(
                                Icons.bolt_rounded,
                                size: 30,
                              ),
                            ),
                            const SizedBox(width: 12),
                            const Text(
                              'WHAT NOW AI',
                              style: TextStyle(
                                fontSize: 21,
                                fontWeight: FontWeight.w900,
                              ),
                            ),
                          ],
                        ),

                        const SizedBox(height: 42),

                        const Text(
                          'What should I\ndo next?',
                          style: TextStyle(
                            fontSize: 40,
                            height: 1.05,
                            fontWeight: FontWeight.w900,
                          ),
                        ),

                        const SizedBox(height: 14),

                        const Text(
                          'Send anything confusing.\n'
                          'Get clear actions.',
                          style: TextStyle(
                            color: Colors.white60,
                            fontSize: 16,
                            height: 1.5,
                          ),
                        ),

                        const SizedBox(height: 28),

                        Container(
                          padding: const EdgeInsets.all(18),
                          decoration: BoxDecoration(
                            color: const Color(0xFF13151E),
                            borderRadius: BorderRadius.circular(25),
                            border: Border.all(
                              color: Colors.white12,
                            ),
                          ),
                          child: Column(
                            children: [
                              TextField(
                                controller: controller,
                                maxLines: 6,
                                decoration: const InputDecoration(
                                  border: InputBorder.none,
                                  hintText:
                                      'Paste a message, bill, offer, '
                                      'problem or anything confusing...',
                                  hintStyle: TextStyle(
                                    color: Colors.white38,
                                  ),
                                ),
                              ),

                              const SizedBox(height: 12),

                              Row(
                                children: [
                                  Expanded(
                                    child: SmallButton(
                                      icon: Icons.content_paste_rounded,
                                      title: 'Paste',
                                      onTap: paste,
                                    ),
                                  ),
                                  const SizedBox(width: 8),
                                  Expanded(
                                    child: SmallButton(
                                      icon: Icons.photo_camera_outlined,
                                      title: 'Photo',
                                      onTap: () {
                                        ScaffoldMessenger.of(context)
                                            .showSnackBar(
                                          const SnackBar(
                                            content: Text(
                                              'Photo input coming next.',
                                            ),
                                          ),
                                        );
                                      },
                                    ),
                                  ),
                                  const SizedBox(width: 8),
                                  Expanded(
                                    child: SmallButton(
                                      icon: Icons.attach_file_rounded,
                                      title: 'File',
                                      onTap: () {
                                        ScaffoldMessenger.of(context)
                                            .showSnackBar(
                                          const SnackBar(
                                            content: Text(
                                              'File input coming next.',
                                            ),
                                          ),
                                        );
                                      },
                                    ),
                                  ),
                                ],
                              ),

                              const SizedBox(height: 16),

                              SizedBox(
                                width: double.infinity,
                                height: 58,
                                child: FilledButton.icon(
                                  onPressed: analyze,
                                  icon: const Icon(
                                    Icons.auto_awesome_rounded,
                                  ),
                                  label: const Text(
                                    'WHAT NOW?',
                                    style: TextStyle(
                                      fontSize: 16,
                                      fontWeight: FontWeight.w900,
                                    ),
                                  ),
                                  style: FilledButton.styleFrom(
                                    backgroundColor:
                                        const Color(0xFF7657FF),
                                    shape: RoundedRectangleBorder(
                                      borderRadius:
                                          BorderRadius.circular(18),
                                    ),
                                  ),
                                ),
                              ),
                            ],
                          ),
                        ),

                        const SizedBox(height: 32),

                        const Text(
                          'TRY IT WITH',
                          style: TextStyle(
                            color: Colors.white38,
                            fontSize: 12,
                            fontWeight: FontWeight.bold,
                            letterSpacing: 2,
                          ),
                        ),

                        const SizedBox(height: 14),

                        ExampleCard(
                          icon: Icons.receipt_long_outlined,
                          title: 'A bill or payment',
                          subtitle: 'Do I need to pay this?',
                          onTap: () {
                            controller.text =
                                'Your payment of ₹4,999 is due by 25 September.';
                          },
                        ),

                        ExampleCard(
                          icon: Icons.work_outline,
                          title: 'A job offer',
                          subtitle: 'Is this offer safe?',
                          onTap: () {
                            controller.text =
                                'Congratulations! Pay ₹2,000 registration fee to start this job.';
                          },
                        ),

                        ExampleCard(
                          icon: Icons.warning_amber_outlined,
                          title: 'A suspicious message',
                          subtitle: 'What should I do?',
                          onTap: () {
                            controller.text =
                                'Your account will be blocked today. Click this link immediately.';
                          },
                        ),
                      ],
                    ),
                  ),
                ),
              );
            }
          }

          class SmallButton extends StatelessWidget {
            final IconData icon;
            final String title;
            final VoidCallback onTap;

            const SmallButton({
              super.key,
              required this.icon,
              required this.title,
              required this.onTap,
            });

            @override
            Widget build(BuildContext context) {
              return InkWell(
                onTap: onTap,
                borderRadius: BorderRadius.circular(15),
                child: Container(
                  padding: const EdgeInsets.symmetric(vertical: 13),
                  decoration: BoxDecoration(
                    color: const Color(0xFF1A1C27),
                    borderRadius: BorderRadius.circular(15),
                  ),
                  child: Column(
                    children: [
                      Icon(icon, size: 21),
                      const SizedBox(height: 5),
                      Text(
                        title,
                        style: const TextStyle(
                          color: Colors.white60,
                          fontSize: 11,
                        ),
                      ),
                    ],
                  ),
                ),
              );
            }
          }

          class ExampleCard extends StatelessWidget {
            final IconData icon;
            final String title;
            final String subtitle;
            final VoidCallback onTap;

            const ExampleCard({
              super.key,
              required this.icon,
              required this.title,
              required this.subtitle,
              required this.onTap,
            });

            @override
            Widget build(BuildContext context) {
              return InkWell(
                onTap: onTap,
                borderRadius: BorderRadius.circular(18),
                child: Container(
                  margin: const EdgeInsets.only(bottom: 10),
                  padding: const EdgeInsets.all(16),
                  decoration: BoxDecoration(
                    color: const Color(0xFF11131A),
                    borderRadius: BorderRadius.circular(18),
                    border: Border.all(color: Colors.white10),
                  ),
                  child: Row(
                    children: [
                      Container(
                        width: 45,
                        height: 45,
                        decoration: BoxDecoration(
                          color: const Color(0xFF211A3D),
                          borderRadius: BorderRadius.circular(13),
                        ),
                        child: Icon(
                          icon,
                          color: const Color(0xFF9C7FFF),
                        ),
                      ),
                      const SizedBox(width: 14),
                      Expanded(
                        child: Column(
                          crossAxisAlignment:
                              CrossAxisAlignment.start,
                          children: [
                            Text(
                              title,
                              style: const TextStyle(
                                fontWeight: FontWeight.bold,
                              ),
                            ),
                            const SizedBox(height: 4),
                            Text(
                              subtitle,
                              style: const TextStyle(
                                color: Colors.white38,
                                fontSize: 12,
                              ),
                            ),
                          ],
                        ),
                      ),
                      const Icon(
                        Icons.chevron_right,
                        color: Colors.white30,
                      ),
                    ],
                  ),
                ),
              );
            }
          }

          class AnalysisScreen extends StatelessWidget {
            final String input;

            const AnalysisScreen({
              super.key,
              required this.input,
            });

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(
                  title: const Text(
                    'WHAT NOW?',
                    style: TextStyle(
                      fontWeight: FontWeight.w900,
                    ),
                  ),
                ),
                body: SingleChildScrollView(
                  padding: const EdgeInsets.all(20),
                  child: Column(
                    crossAxisAlignment:
                        CrossAxisAlignment.start,
                    children: [
                      const Text(
                        'Here is what matters.',
                        style: TextStyle(
                          fontSize: 28,
                          fontWeight: FontWeight.w900,
                        ),
                      ),

                      const SizedBox(height: 12),

                      Text(
                        input,
                        style: const TextStyle(
                          color: Colors.white54,
                          height: 1.5,
                        ),
                      ),

                      const SizedBox(height: 22),

                      ResultCard(
                        icon: Icons.info_outline,
                        title: 'WHAT IS THIS?',
                        text:
                            'This is information that may require your attention. Check the sender, details and requested action.',
                      ),

                      ResultCard(
                        icon: Icons.bolt,
                        title: 'URGENCY',
                        text:
                            'Check the exact deadline before taking action.',
                      ),

                      ResultCard(
                        icon: Icons.shield_outlined,
                        title: 'RISK',
                        text:
                            'Be careful with unexpected links, payments or requests for personal information.',
                      ),

                      ResultCard(
                        icon: Icons.event_outlined,
                        title: 'DEADLINE',
                        text:
                            'Look for the exact date or time in the original message.',
                      ),

                      const SizedBox(height: 8),

                      Container(
                        padding: const EdgeInsets.all(20),
                        decoration: BoxDecoration(
                          color: const Color(0xFF18141F),
                          borderRadius: BorderRadius.circular(22),
                          border: Border.all(
                            color: const Color(0x557C5CFF),
                          ),
                        ),
                        child: const Column(
                          crossAxisAlignment:
                              CrossAxisAlignment.start,
                          children: [
                            Text(
                              'WHAT SHOULD I DO NOW?',
                              style: TextStyle(
                                fontWeight: FontWeight.w900,
                              ),
                            ),
                            SizedBox(height: 18),
                            ActionStep(
                              number: '1',
                              text:
                                  'Verify the sender and important details.',
                            ),
                            ActionStep(
                              number: '2',
                              text:
                                  'Check the deadline before acting.',
                            ),
                            ActionStep(
                              number: '3',
                              text:
                                  'Do not pay or share sensitive information until verified.',
                            ),
                          ],
                        ),
                      ),

                      const SizedBox(height: 14),

                      Container(
                        padding: const EdgeInsets.all(20),
                        decoration: BoxDecoration(
                          color: const Color(0xFF191317),
                          borderRadius: BorderRadius.circular(22),
                        ),
                        child: const Column(
                          crossAxisAlignment:
                              CrossAxisAlignment.start,
                          children: [
                            Row(
                              children: [
                                Icon(
                                  Icons.warning_amber_rounded,
                                  color: Colors.redAccent,
                                ),
                                SizedBox(width: 10),
                                Text(
                                  'WHAT IF I DO NOTHING?',
                                  style: TextStyle(
                                    fontWeight: FontWeight.w900,
                                  ),
                                ),
                              ],
                            ),
                            SizedBox(height: 14),
                            Text(
                              'You could miss a deadline, lose an opportunity, face extra charges or allow a possible risk to continue.',
                              style: TextStyle(
                                color: Colors.white54,
                                height: 1.5,
                              ),
                            ),
                          ],
                        ),
                      ),

                      const SizedBox(height: 18),

                      const Text(
                        'NEXT 3 STEPS',
                        style: TextStyle(
                          color: Colors.white38,
                          fontSize: 12,
                          fontWeight: FontWeight.bold,
                          letterSpacing: 2,
                        ),
                      ),

                      const SizedBox(height: 12),

                      const ActionStep(
                        number: '1',
                        text: 'Verify the information.',
                      ),
                      const ActionStep(
                        number: '2',
                        text:
                            'Check deadline, cost and possible risk.',
                      ),
                      const ActionStep(
                        number: '3',
                        text:
                            'Take the safest appropriate action.',
                      ),

                      const SizedBox(height: 18),

                      Container(
                        width: double.infinity,
                        padding: const EdgeInsets.all(20),
                        decoration: BoxDecoration(
                          color: const Color(0xFF12141A),
                          borderRadius: BorderRadius.circular(20),
                        ),
                        child: const Column(
                          crossAxisAlignment:
                              CrossAxisAlignment.start,
                          children: [
                            Text(
                              'DRAFT REPLY',
                              style: TextStyle(
                                fontWeight: FontWeight.w900,
                              ),
                            ),
                            SizedBox(height: 12),
                            Text(
                              'Thanks for the information. I will verify the details and get back to you shortly.',
                              style: TextStyle(
                                color: Colors.white54,
                                height: 1.5,
                              ),
                            ),
                          ],
                        ),
                      ),

                      const SizedBox(height: 20),

                      Center(
                        child: Text(
                          'WHAT NOW AI • Verify important information.',
                          style: TextStyle(
                            color: Colors.white24,
                            fontSize: 11,
                          ),
                        ),
                      ),
                    ],
                  ),
                ),
              );
            }
          }

          class ResultCard extends StatelessWidget {
            final IconData icon;
            final String title;
            final String text;

            const ResultCard({
              super.key,
              required this.icon,
              required this.title,
              required this.text,
            });

            @override
            Widget build(BuildContext context) {
              return Container(
                width: double.infinity,
                margin: const EdgeInsets.only(bottom: 12),
                padding: const EdgeInsets.all(18),
                decoration: BoxDecoration(
                  color: const Color(0xFF12141A),
                  borderRadius: BorderRadius.circular(20),
                  border: Border.all(color: Colors.white10),
                ),
                child: Column(
                  crossAxisAlignment:
                      CrossAxisAlignment.start,
                  children: [
                    Row(
                      children: [
                        Icon(
                          icon,
                          color: const Color(0xFF9B82FF),
                        ),
                        const SizedBox(width: 10),
                        Text(
                          title,
                          style: const TextStyle(
                            fontSize: 12,
                            fontWeight: FontWeight.w900,
                            letterSpacing: 1,
                          ),
                        ),
                      ],
                    ),
                    const SizedBox(height: 12),
                    Text(
                      text,
                      style: const TextStyle(
                        color: Colors.white60,
                        height: 1.5,
                      ),
                    ),
                  ],
                ),
              );
            }
          }

          class ActionStep extends StatelessWidget {
            final String number;
            final String text;

            const ActionStep({
              super.key,
              required this.number,
              required this.text,
            });

            @override
            Widget build(BuildContext context) {
              return Padding(
                padding: const EdgeInsets.only(bottom: 13),
                child: Row(
                  crossAxisAlignment:
                      CrossAxisAlignment.start,
                  children: [
                    Container(
                      width: 28,
                      height: 28,
                      alignment: Alignment.center,
                      decoration: BoxDecoration(
                        color: const Color(0xFF7657FF),
                        borderRadius:
                            BorderRadius.circular(9),
                      ),
                      child: Text(
                        number,
                        style: const TextStyle(
                          fontWeight: FontWeight.bold,
                        ),
                      ),
                    ),
                    const SizedBox(width: 12),
                    Expanded(
                      child: Text(
                        text,
                        style: const TextStyle(
                          color: Colors.white60,
                          height: 1.4,
                        ),
                      ),
                    ),
                  ],
                ),
              );
            }
          }
          DART

      - name: Build APK
        run: |
          cd app
          flutter pub get
          flutter analyze
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WHAT-NOW-AI-APK
          path: app/build/app/outputs/flutter-apk/app-release.apk
