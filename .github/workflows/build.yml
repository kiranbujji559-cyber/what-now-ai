name: WHAT NOW AI Build

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.3'
          channel: 'stable'
      
      - name: Create android folder if missing
        run: |
          if [ ! -d "android" ]; then
            flutter create . --platforms=android
          else
            # Old gradle fix - recreate android to make it compatible
            rm -rf android
            flutter create . --org com.whatnowai.app --platforms=android --project-name what_now_ai
          fi
          
      - name: Run flutter pub get
        run: flutter pub get
        
      - name: Build DEBUG APK - easy install
        run: flutter build apk --debug
        
      - name: Build RELEASE APK
        run: flutter build apk --release
        
      - name: Build AAB for Play Store
        run: flutter build appbundle --release
        
      - uses: actions/upload-artifact@v4
        with:
          name: what-now-ai-apks
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/bundle/release/*.aab
