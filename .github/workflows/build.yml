name: Build APK AAB
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.3'
      - name: Setup Android & Permissions
        run: |
          cp assets/icon.png /tmp/icon.png
          cp android/app/google-services.json /tmp/google-services.json || true
          rm -rf android
          flutter create . --platforms=android --project-name what_now_ai --org com.kiran.whatnowai --no-pub
          mkdir -p assets android/app
          cp /tmp/icon.png assets/icon.png
          cp /tmp/google-services.json android/app/google-services.json || true
          sed -i 's/<application/<uses-permission android:name="android.permission.INTERNET"\/>\n    <uses-permission android:name="android.permission.RECORD_AUDIO"\/>\n    <application/' android/app/src/main/AndroidManifest.xml
      - run: flutter pub get
      - run: dart run flutter_launcher_icons
      - run: flutter build apk --release --dart-define=GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: what-now-ai-apk
          path: build/app/outputs/flutter-apk/app-release.apk

