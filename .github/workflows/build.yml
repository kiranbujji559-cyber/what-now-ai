class IgnoreCard extends StatefulWidget {
  const IgnoreCard({super.key});

  @override
  State<IgnoreCard> createState() => _IgnoreCardState();
}

class _IgnoreCardState extends State<IgnoreCard> {
  bool open = false;

  @override
  Widget build(BuildContext context) {
    return Container(
      decoration: BoxDecoration(
        color: const Color(0xFF181318),
        borderRadius: BorderRadius.circular(20),
      ),
      child: Column(
        children: [
          ListTile(
            onTap: () {
              setState(() {
                open = !open;
              });
            },
            leading: const Icon(
              Icons.warning_amber_rounded,
              color: Colors.redAccent,
            ),
            title: const Text(
              'WHAT IF I DO NOTHING?',
              style: TextStyle(
                fontSize: 13,
                fontWeight: FontWeight.w900,
              ),
            ),
            trailing: Icon(
              open
                  ? Icons.keyboard_arrow_up
                  : Icons.keyboard_arrow_down,
            ),
          ),
          if (open)
            const Padding(
              padding: EdgeInsets.fromLTRB(20, 0, 20, 20),
              child: Text(
                'You may miss a deadline, lose an opportunity or face additional charges. Check the original information before deciding.',
                style: TextStyle(
                  color: Colors.white54,
                  height: 1.5,
                ),
              ),
            ),
        ],
      ),
    );
  }
}

