name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'

      - name: Build APK Real Firebase
        run: |
          cp android/app/google-services.json /tmp/g.json 2>/dev/null || cp google-services.json /tmp/g.json 2>/dev/null || true
          cp lib/main.dart /tmp/m.dart
          cp pubspec.yaml /tmp/p.yaml
          
          rm -rf android
          flutter create --project-name what_now_ai --platforms=android --org com.example.whatnowai .
          
          cp /tmp/m.dart lib/main.dart
          cp /tmp/p.yaml pubspec.yaml
          mkdir -p android/app
          cp /tmp/g.json android/app/google-services.json
          ls -lh android/app/google-services.json
          
          # OLD GRADLE FIX - 3.19.6 ki idi 100% work
          echo "apply plugin: 'com.google.gms.google-services'" >> android/app/build.gradle
          sed -i "s/dependencies {/dependencies {\n        classpath 'com.google.gms:google-services:4.4.0'/" android/build.gradle
          
          flutter pub get
          flutter build apk --debug

      - uses: actions/upload-artifact@v4
        with:
          name: WHAT-NOW-AI-FINAL-WORKING-APK
          path: build/app/outputs/flutter-apk/app-debug.apk
