name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'

      - name: Create Android Folder Fresh
        run: |
          # Fix pubspec name to underscore
          sed -i 's/name: what-now-ai/name: what_now_ai/' pubspec.yaml || true
          cat pubspec.yaml | head -5
          rm -rf android
          flutter create --project-name what_now_ai --platforms=android --org com.example . --no-overwrite
          ls android/app/build.gradle
          echo "SUCCESS - Android folder created!"

      - run: flutter pub get
      - run: flutter build apk --debug

      - uses: actions/upload-artifact@v4
        with:
          name: WHAT-NOW-AI-FINAL-APK
          path: build/app/outputs/flutter-apk/app-debug.apk
