name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.3'
          channel: 'stable'

      - name: Build APK Real Firebase
        run: |
          mkdir -p /tmp/save
          cp android/app/google-services.json /tmp/save/ 2>/dev/null && echo "SAVED" || echo "No file"
          cp google-services.json /tmp/save/google-services.json 2>/dev/null || true
          cp lib/main.dart /tmp/main.dart
          cp pubspec.yaml /tmp/pubspec.yaml
          
          rm -rf android
          flutter create --project-name what_now_ai --platforms=android --org com.example.whatnowai .
          
          cp /tmp/main.dart lib/main.dart
          cp /tmp/pubspec.yaml pubspec.yaml
          mkdir -p android/app
          cp /tmp/save/google-services.json android/app/google-services.json && echo "RESTORED" && ls -lh android/app/google-services.json
          
          python3 << 'PY'
          import pathlib
          for path in ["android/build.gradle", "android/build.gradle.kts"]:
              p = pathlib.Path(path)
              if p.exists():
                  t = p.read_text()
                  if "google-services" not in t:
                      t = t.replace("dependencies {", "dependencies {\n        classpath 'com.google.gms:google-services:4.4.0'\n        classpath \"com.google.gms:google-services:4.4.0\"")
                      p.write_text(t)
                      print(f"Fixed {path}")
          for path in ["android/app/build.gradle", "android/app/build.gradle.kts"]:
              p = pathlib.Path(path)
              if p.exists():
                  t = p.read_text()
                  if "google-services" not in t:
                      if 'id "com.android.application"' in t:
                          t = t.replace('id "com.android.application"', 'id "com.android.application"\n    id "com.google.gms.google-services"')
                      if 'id("com.android.application")' in t:
                          t = t.replace('id("com.android.application")', 'id("com.android.application")\n    id("com.google.gms.google-services")')
                      p.write_text(t)
                      print(f"Fixed {path}")
          PY
          
          flutter pub get
          flutter build apk --debug

      - uses: actions/upload-artifact@v4
        with:
          name: WHAT-NOW-AI-FINAL-WORKING-APK
          path: build/app/outputs/flutter-apk/app-debug.apk
