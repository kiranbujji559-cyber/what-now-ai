name: Build APK AAB
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.3'
          channel: 'stable'
      - name: Build REAL APK AAB
        run: |
          if [ ! -f "android/build.gradle" ]; then
            flutter create . --platforms=android --project-name what_now_ai --org com.example
          fi
          python3 << 'PY'
          import pathlib
          b = pathlib.Path("android/build.gradle")
          t = b.read_text()
          if "google-services" not in t:
              t = t.replace("dependencies {", "dependencies {\n        classpath 'com.google.gms:google-services:4.4.0'", 1)
              b.write_text(t)
          a = pathlib.Path("android/app/build.gradle")
          t2 = a.read_text()
          if "google-services" not in t2:
              t2 = t2.replace("apply plugin: 'com.android.application'", "apply plugin: 'com.android.application'\napply plugin: 'com.google.gms.google-services'")
              a.write_text(t2)
          PY
          flutter pub get
          flutter build apk --release
          flutter build appbundle --release
      - uses: actions/upload-artifact@v4
        with:
          name: WHAT-NOW-AI-APK
          path: build/app/outputs/flutter-apk/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: WHAT-NOW-AI-AAB
          path: build/app/outputs/bundle/release/app-release.aab
