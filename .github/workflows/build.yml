name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
      - name: Prepare icon - REAL YOUR OWN ICON
        run: |
          mkdir -p assets
          if [ ! -f assets/icon.png ]; then
            echo "Creating dummy icon..."
            flutter create --platforms=android .
            cp android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png assets/icon.png || echo "dummy" > assets/icon.png
          fi
      - name: Get dependencies
        run: flutter pub get
      - name: Build APK - REAL FEATURES
        run: flutter build apk --debug -v
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
