name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'

      - name: Build APK Real Firebase
        run: |
          cp android/app/google-services.json /tmp/g.json 2>/dev/null || cp google-services.json /tmp/g.json
          cp lib/main.dart /tmp/m.dart
          cp pubspec.yaml /tmp/p.yaml
          
          rm -rf android
          flutter create --project-name what_now_ai --platforms=android --org com.example.whatnowai .
          
          cp /tmp/m.dart lib/main.dart
          cp /tmp/p.yaml pubspec.yaml
          cp /tmp/g.json android/app/google-services.json
          echo "=== GOOGLE JSON RESTORED ==="
          ls -lh android/app/google-services.json

          python3 << 'PY'
          import pathlib
          # FIX android/build.gradle - ADD CLASSPATH
          p = pathlib.Path("android/build.gradle")
          text = p.read_text()
          print("BEFORE BUILD.GRADLE:")
          print(text[:500])
          if "google-services" not in text:
              # Insert after first dependencies {
              text = text.replace("dependencies {", "dependencies {\n        classpath 'com.google.gms:google-services:4.4.0'", 1)
              p.write_text(text)
              print("ADDED CLASSPATH TO android/build.gradle")
          
          # FIX android/app/build.gradle - ADD PLUGIN
          p2 = pathlib.Path("android/app/build.gradle")
          text2 = p2.read_text()
          if "google-services" not in text2:
              text2 = text2 + "\napply plugin: 'com.google.gms.google-services'\n"
              p2.write_text(text2)
              print("ADDED PLUGIN TO android/app/build.gradle")
          
          print("AFTER:")
          print(pathlib.Path("android/build.gradle").read_text()[:800])
          PY
          
          flutter pub get
          flutter build apk --debug

      - uses: actions/upload-artifact@v4
        with:
          name: WHAT-NOW-AI-FINAL-WORKING-APK
          path: build/app/outputs/flutter-apk/app-debug.apk
