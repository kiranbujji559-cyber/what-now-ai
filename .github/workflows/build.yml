name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.3'
      - name: Create fresh Android V2
        run: |
          rm -rf android
          flutter create . --platforms=android --project-name what_now_ai --org com.example --no-pub
          ls android/app/src/main/kotlin/com/example/what_now_ai/
      - run: flutter pub get
      - run: flutter build apk --release --verbose
      - uses: actions/upload-artifact@v4
        with:
          name: what-now-ai-apk
          path: build/app/outputs/flutter-apk/app-release.apk
