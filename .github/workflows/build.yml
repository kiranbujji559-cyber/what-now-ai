name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
      - name: Recreate Android V2 fresh
        run: |
          cp pubspec.yaml /tmp/pubspec.yaml
          rm -rf android
          flutter create . --platforms=android --project-name what_now_ai --org com.example
          cp /tmp/pubspec.yaml pubspec.yaml
          ls android/app/src/main/kotlin/com/example/what_now_ai/
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: what-now-ai-apk
          path: build/app/outputs/flutter-apk/app-release.apk
